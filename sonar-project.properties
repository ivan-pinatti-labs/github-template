# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
#
# No sonar.organization or sonar.projectKey here, on purpose. This is a
# template repository, and every repository created from it copies this file
# once. A key written here would point each copy at this template's own
# project. The workflow passes both instead, built from the repository it
# runs in (`<owner>_<repository name>`), which is the key SonarQube Cloud
# gives a project imported from GitHub by default.
#
# A repository created from this template therefore needs its own SonarQube
# Cloud project, imported under that default key with Automatic Analysis
# turned off (the two cannot run side by side, and a CI scan aborts while
# Automatic Analysis is on), and a SONAR_TOKEN secret it can read. See
# "Using this template" in README.md.

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (the workflows, YAML and the L2
# Dockerfile here) plus its secrets detection, which runs over every text
# file. .secrets.baseline is generated by detect-secrets and only records
# hashes. There is no tests/ folder, so no sonar.tests yet; a repository
# created from this template adds one, with coverage, once it has tests.
sonar.sources=.
sonar.exclusions=.secrets.baseline

sonar.sourceEncoding=UTF-8
