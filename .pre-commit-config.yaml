---
# Starter pre-commit config for a repo created from this template. Pulls
# the language-agnostic checklists from ivan-pinatti-labs/pre-commit-checklists:
# file hygiene, spelling, the common structured file types, credential
# scanning, and the two git message/branch-name guards. Add a
# language-specific checklist id (checklist-dev-python, checklist-dev-shell,
# and so on) once you know what the new repo is actually written in; see
# https://github.com/ivan-pinatti-labs/pre-commit-checklists/blob/main/docs/hook-catalogue.md
# for the full list.
#
# checklist-dev-dotenv is deliberately not selected below: since
# pre-commit-checklists v1.1.0 it shells out to Docker or Podman (see that
# library's docs/hook-catalogue.md), and a generic starter should not make
# every new repo depend on a container runtime for something as narrow as
# .env linting. Add it yourself, once your new repo actually has .env
# files and you have confirmed Docker or Podman will be on every
# contributor's PATH, with a files: '(^|/)\.env(\..+)?$' selector.
#
# checklist-github-actions below does have a Docker dependency of its own
# (actionlint-docker runs in a container) and a Python 3.10 or newer
# dependency (zizmor, an offline only workflow security auditor with no
# token requirement); see this repo's README for why both are kept
# anyway.
#
# After creating a repo from this template, run:
#
#   pre-commit install
#   pre-commit run --all-files
#
# One id below (checklist-git-commit-msg) runs at the commit-msg git hook
# stage instead of pre-commit, so default_install_hook_types wires up both
# stages. Every other hook is pinned to stages: [pre-commit] so it does not
# also re-run during that commit-msg invocation.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    # Bump this to whatever https://github.com/ivan-pinatti-labs/pre-commit-checklists/releases
    # lists as latest; see that library's docs/versioning.md for what the
    # pin means and how a bump can change hook behavior.
    rev: v2.2.3
    hooks:
      # Large-file/merge-conflict/line-ending hygiene, safe on any repo.
      - id: checklist-basic
        stages: [pre-commit]

      # Spell-checks every file cspell can read; tune words in .cspell.json.
      # .secrets.baseline is excluded here, not just in .cspell.json's own
      # ignorePaths: cspell exits nonzero when a batch of files pre-commit
      # hands it happens to contain only paths its own ignorePaths already
      # excludes, since it then reports zero files checked as an error.
      # Excluding it at the pre-commit level keeps it out of every batch.
      - id: checklist-spell
        exclude: ^\.secrets\.baseline$
        stages: [pre-commit]

      # Lints and link-checks Markdown.
      - id: checklist-markdown
        types: [markdown]
        stages: [pre-commit]

      # Validates JSON syntax and formats with Prettier. types_or: [json,
      # json5], not a plain types: [json]: .github/renovate.json5 is typed
      # json5 by identify, not json, so a plain types: [json] would match
      # nothing on it at all. check-json self-filters on its own
      # types: [json] and never sees the json5 file, which is correct: it is
      # a strict JSON parser and renovate.json5 has comments and unquoted
      # keys. Prettier reads json5 natively and formats it.
      - id: checklist-json
        types_or: [json, json5]
        stages: [pre-commit]

      # Validates YAML syntax, lints with yamllint, formats with Prettier.
      - id: checklist-yaml
        types: [yaml]
        stages: [pre-commit]

      # Validates TOML syntax.
      - id: checklist-toml
        types: [toml]
        stages: [pre-commit]

      # Validates XML syntax.
      - id: checklist-xml
        types: [xml]
        stages: [pre-commit]

      # Checks .editorconfig rules are respected.
      - id: checklist-dev-editorconfig
        stages: [pre-commit]

      # Blocks committed private keys and known secret patterns. Requires
      # a .secrets.baseline file at the repo root; see
      # ivan-pinatti-labs/pre-commit-checklists' scripts/install.sh to generate one.
      - id: checklist-security-credentials
        stages: [pre-commit]

      # Rejects branch names that skip a naming convention. No ticket prefix
      # is required by default.
      - id: checklist-git-valid-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Rejects commit messages that are not Conventional Commits. No ticket
      # prefix is required by default.
      - id: checklist-git-commit-msg
        stages: [commit-msg]
        files: ^\.git/COMMIT_EDITMSG$

      # Blocks direct commits to long-lived branches (main, master, develop,
      # staging by default).
      - id: checklist-git-protected-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Lints GitHub Actions workflow files with actionlint-docker (needs
      # Docker on PATH) and audits them with zizmor (needs Python 3.10 or
      # newer on PATH, offline audits only, no token required); see this
      # repo's README. This id's own files: pattern already reaches every
      # workflow the merge pipeline adds (coderabbit-gate.yml,
      # coderabbit-review-queue.yml, bot-auto-merge.yml) since all of them
      # live under .github/; no separate selector is needed for those.
      - id: checklist-github-actions
        files: ^\.github/
        stages: [pre-commit]

      # check-ast, check-builtin-literals, debug-statements,
      # requirements-txt-fixer, ruff-check --fix, ruff-format. Scoped to
      # scripts/, not the whole repo: this template stays language-agnostic,
      # and the only Python here is the merge pipeline's two verdict scripts
      # (scripts/assert-pin-only-diff.py, scripts/coderabbit-review-verdict.py).
      # Drop this id, or widen the selector, once the repo created from this
      # template actually is a Python project.
      - id: checklist-dev-python
        files: ^scripts/.*\.py$
        stages: [pre-commit]
